[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "justifycert"
version = "0.2.0"
description = "A minimal TLS certificate analysis CLI and library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
]

[project.scripts]
justifycert = "justifycert.cli:main"

[tool.setuptools]
packages = ["justifycert"]
